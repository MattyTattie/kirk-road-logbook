<!doctype html>
<!--
  index.html — the one and only page of the app.

  It's deliberately almost empty: a slim top bar, a <main> box that
  app.js fills in with whichever screen you're on (dashboard, list, form…),
  and the bottom navigation bar.

  The app's name lives in js/config.js; the <title> here is just what
  shows for a split second before the JavaScript starts.
-->
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <!-- Makes the page fit the phone's screen width instead of a zoomed-out desktop view -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hearth</title>
    <meta name="description" content="A private home logbook: receipts, warranties, jobs, electricity bills and insurance. Kept on your phone, and in your own Google Drive only if you turn on sharing." />
    <meta name="color-scheme" content="light dark" />

    <!-- The manifest tells Chrome "this is an installable app" (name, icons, colours) -->
    <link rel="manifest" href="manifest.json" />
    <!-- Colour of the phone's status bar / title bar (theme.js updates it for dark mode) -->
    <meta name="theme-color" content="#f6f4ef" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preload" href="fonts/inter-latin.woff" as="font" type="font/woff" crossorigin />

    <!-- Apply a saved Light/Dark choice before anything is drawn (no flash) -->
    <script>
      try { var t = localStorage.getItem('hearthbook.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Launch screen: the logo fades away once the first screen is drawn (styles.css "splash") -->
    <div id="splash" aria-hidden="true"><img src="icons/icon.svg" alt="" width="84" height="84" /><span data-app-name>Hearth</span></div>
    <a class="skip" href="#app">Skip to content</a>
    <header class="topbar">
      <a href="#/home" class="brand" aria-label="Home">
        <img src="icons/icon.svg" alt="" width="30" height="30" />
        <span data-app-name>Hearth</span>
      </a>
      <button type="button" class="private-chip" id="sync-chip" title="Kept on this phone (and in your own Google Drive if you turn on sharing)">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11h12v9.5H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></svg>
        <span id="sync-chip-text">On this phone</span>
      </button>
    </header>

    <!-- app.js draws each screen in here -->
    <main id="app" tabindex="-1">
      <noscript>This app needs JavaScript switched on.</noscript>
    </main>

    <!-- Bottom navigation (thumb-friendly). Icons are inline SVG. -->
    <nav class="bottom-nav" aria-label="Main">
      <a href="#/home" data-tab="home" id="nav-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.2 12 3.5l8.5 6.7V19a1.5 1.5 0 0 1-1.5 1.5h-4.2v-6h-5.6v6H5A1.5 1.5 0 0 1 3.5 19z"/></svg>
        <span>Home</span>
      </a>
      <a href="#/list/all" data-tab="list" id="nav-list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
        <span>Logbook</span>
      </a>
      <a href="#/new" class="nav-add" id="add" aria-label="Add entry">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </a>
      <a href="#/list/meter" data-tab="meter" id="nav-meter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 17a8 8 0 1 1 15 0M12 13l3.5-4"/></svg>
        <span>Electricity</span>
      </a>
      <a href="#/export" data-tab="export" id="export-nav" aria-label="More: manuals, backup and settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h10"/></svg>
        <span>More</span>
      </a>
    </nav>

    <!-- type="module" lets us use "import" between our JavaScript files -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
